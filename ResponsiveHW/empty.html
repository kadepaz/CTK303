<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empty Decorative Nav Buttons</title>
<style>
  body {
    background: #f4f4f4;
    font-family: sans-serif;
  }

  /* Navigation container */
  nav {
    display: flex;
    gap: 15px;
    justify-content: center;
    padding: 20px;
  }

  /* Base button style */
  .nav-btn {
    width: 40px;
    height: 40px;
    border: 2px solid #333;
    background: transparent;
    border-radius: 50%; /* Makes them circular */
    cursor: pointer;
    transition: all 0.3s ease;
  }

  /* Hover effect */
  .nav-btn:hover {
    background: #333;
    border-color: #333;
    transform: scale(1.1);
  }

  /* Optional: rectangular style */
  .rect {
    border-radius: 6px;
  }
</style>
</head>
<body>

<nav>
  <!-- Circular buttons -->
  <button class="nav-btn"></button>
  <button class="nav-btn"></button>
  <button class="nav-btn"></button>

  <!-- Rectangular buttons -->
  <button class="nav-btn rect"></button>
  <button class="nav-btn rect"></button>
</nav>

</body>
</html>
